<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized public service license process overview</title>
  <desc id="desc">A simplified BPMN-inspired flow from application intake to license issuance, including parallel review, correction and rejection paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#0f172a}.small{font-size:16px}.stage{font-size:18px;font-weight:700}.title{font-size:34px;font-weight:750}.subtitle{font-size:18px;fill:#475569}.flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.decision{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.success{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.stop{fill:#fff1f2;stroke:#f43f5e;stroke-width:2}.lane{fill:#f8fafc;stroke:#e2e8f0;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f1f5f9"/>
  <text x="80" y="70" class="label title">Public Service License Process</text>
  <text x="80" y="104" class="label subtitle">BPMN 2.0 analysis used for an implemented software workflow</text>
  <rect x="60" y="145" width="1480" height="450" rx="28" class="lane"/>

  <circle cx="110" cy="330" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M134 330 H200" class="flow"/>

  <g filter="url(#shadow)"><rect x="200" y="270" width="180" height="120" rx="16" class="box"/></g>
  <text x="290" y="316" text-anchor="middle" class="label stage">Application</text>
  <text x="290" y="343" text-anchor="middle" class="label stage">intake</text>
  <text x="290" y="370" text-anchor="middle" class="label small">Register request</text>
  <path d="M380 330 H440" class="flow"/>

  <g transform="translate(485 330) rotate(45)"><rect x="-42" y="-42" width="84" height="84" rx="8" class="decision"/></g>
  <text x="485" y="323" text-anchor="middle" class="label stage">Complete?</text>
  <text x="485" y="349" text-anchor="middle" class="label small">Eligibility check</text>

  <path d="M527 330 H595" class="flow"/>
  <text x="555" y="310" class="label small">Yes</text>
  <g filter="url(#shadow)"><rect x="595" y="270" width="210" height="120" rx="16" class="box"/></g>
  <text x="700" y="316" text-anchor="middle" class="label stage">Parallel technical</text>
  <text x="700" y="343" text-anchor="middle" class="label stage">assessment</text>
  <text x="700" y="370" text-anchor="middle" class="label small">Consolidate reviews</text>

  <path d="M805 330 H865" class="flow"/>
  <g filter="url(#shadow)"><rect x="865" y="270" width="190" height="120" rx="16" class="box"/></g>
  <text x="960" y="316" text-anchor="middle" class="label stage">Site inspection</text>
  <text x="960" y="347" text-anchor="middle" class="label small">Record findings</text>
  <path d="M1055 330 H1115" class="flow"/>

  <g transform="translate(1160 330) rotate(45)"><rect x="-42" y="-42" width="84" height="84" rx="8" class="decision"/></g>
  <text x="1160" y="323" text-anchor="middle" class="label stage">Pass?</text>
  <text x="1160" y="349" text-anchor="middle" class="label small">Decision</text>

  <path d="M1202 330 H1260" class="flow"/>
  <text x="1225" y="310" class="label small">Yes</text>
  <g filter="url(#shadow)"><rect x="1260" y="270" width="190" height="120" rx="16" class="success"/></g>
  <text x="1355" y="316" text-anchor="middle" class="label stage">Formal approval</text>
  <text x="1355" y="347" text-anchor="middle" class="label small">Issue license</text>
  <path d="M1450 330 H1490" class="flow"/>
  <circle cx="1512" cy="330" r="22" fill="#d1fae5" stroke="#059669" stroke-width="7"/>

  <path d="M485 372 V485 H340" class="flow"/>
  <text x="500" y="430" class="label small">No</text>
  <g filter="url(#shadow)"><rect x="160" y="440" width="180" height="90" rx="16" class="stop"/></g>
  <text x="250" y="477" text-anchor="middle" class="label stage">Return or close</text>
  <text x="250" y="505" text-anchor="middle" class="label small">Missing information</text>

  <path d="M1160 372 V490 H960 V390" class="flow"/>
  <text x="1175" y="430" class="label small">Correction required</text>

  <rect x="80" y="630" width="1440" height="70" rx="18" fill="#0f172a"/>
  <text x="110" y="672" class="label small" fill="#fff" style="fill:#fff">From process analysis to implementation: roles, decisions, parallel work and exception paths were modeled end to end.</text>
</svg>
